    /* LOGIN */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-box { background: var(--white); border-radius: 20px; padding: 48px 40px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center; }
    .login-logo { margin-bottom: 8px; display: flex; justify-content: center; }
    .login-logo img { height: 36px; width: auto; }
    .login-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; font-family: var(--font); }
    .login-box label { display: block; text-align: left; font-size: 13px; font-weight: 600; color: var(--black); margin-bottom: 6px; font-family: var(--font); }
    .login-box input[type=password] {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 15px; font-family: var(--font);
      outline: none; transition: border-color .2s; margin-bottom: 16px;
    }
    .login-box input:focus { border-color: var(--orange); }
    .btn-login {
      width: 100%; padding: 13px; background: var(--black); color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity .2s; font-family: var(--font);
    }
    .btn-login:hover { opacity: .8; }
    .login-error { font-size: 13px; color: var(--orange); margin-top: 12px; font-family: var(--font); }

    /* ADMIN */
    #admin { display: none; }
    header {
      background: rgba(255,255,255,.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .header-logo img { height: 28px; width: auto; }
    .header-badge { font-size: 12px; font-weight: 600; background: var(--bg); color: var(--muted); padding: 4px 12px; border-radius: 20px; font-family: var(--font); }

    .main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    .main h2 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; font-family: var(--font); }
    .main-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; font-family: var(--font); }

    .btn-add {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--orange); color: white; border: none;
      padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .2s; margin-bottom: 28px; font-family: var(--font);
    }
    .btn-add:hover { opacity: .88; }

    table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    thead { background: var(--bg); }
    th { padding: 14px 16px; text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-family: var(--font); }
    td { padding: 14px 16px; border-top: 1px solid var(--border); font-size: 14px; vertical-align: middle; font-family: var(--font); }
    tr:hover td { background: #FAFAFA; }
    .td-img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--bg); }
    .td-name { font-weight: 600; }
    .td-cat { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 20px; background: rgba(254,104,0,.12); color: var(--orange); font-family: var(--font); }
    .td-cat.rep { background: rgba(0,0,0,.06); color: var(--muted); }
    .td-price { font-weight: 700; font-size: 16px; }
    .td-active { width: 20px; height: 20px; border-radius: 50%; background: #30D158; display: inline-block; }
    .td-active.off { background: #E5E5E5; }
    .btn-edit { padding: 7px 14px; background: var(--black); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s; font-family: var(--font); }
    .btn-edit:hover { opacity: .8; }
    .btn-del { padding: 7px 14px; background: transparent; color: var(--orange); border: 1.5px solid var(--orange); border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 6px; transition: background .2s; font-family: var(--font); }
    .btn-del:hover { background: rgba(254,104,0,.08); }

    /* MODAL */
    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; padding: 24px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--white); border-radius: 20px; padding: 36px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 24px; font-family: var(--font); }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; font-family: var(--font); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px; font-family: var(--font);
      outline: none; transition: border-color .2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--orange); }
    .field textarea { resize: vertical; min-height: 80px; }
    .modal-img-preview { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; background: var(--bg); margin-top: 10px; display: block; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-save { flex: 1; padding: 13px; background: var(--black); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s; font-family: var(--font); }
    .btn-save:hover { opacity: .8; }
    .btn-cancel { padding: 13px 20px; background: var(--bg); color: var(--black); border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--font); }
    .toggle-wrap { display: flex; align-items: center; gap: 10px; }
    .toggle { width: 44px; height: 26px; background: #E5E5E5; border-radius: 13px; position: relative; cursor: pointer; transition: background .2s; border: none; }
    .toggle.on { background: #30D158; }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: left .2s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    .toggle.on::after { left: 21px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 5px; font-family: var(--font); }
    .msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 14px; font-family: var(--font); }
    .msg.ok { background: #ECFDF5; color: #065F46; }
    .msg.err { background: #FFF3ED; color: #9A3412; }
  </style>
</head>

  <div class="main">
    <h2>Productos</h2>
    <p class="main-sub">Editá nombres, precios, descripciones e imágenes. Los cambios se aplican al sitio de inmediato.</p>
    <button class="btn-add" onclick="openModal()">+ Agregar producto</button>
    <table>
      <thead>
        <tr>
          <th>Imagen</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Activo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">Nuevo producto</h3>
    <input type="hidden" id="f-id">

    <div class="field">
      <label>Nombre del producto</label>
      <input type="text" id="f-name" placeholder="Ej: Parrilla eGrill Modelo E1">
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="f-cat">
        <option value="parrilla">Parrilla eléctrica</option>
        <option value="repuesto">Repuesto</option>
      </select>
    </div>
    <div class="field">
      <label>Precio (en pesos, sin puntos ni comas)</label>
      <input type="number" id="f-price" placeholder="79992">
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="f-desc" placeholder="Descripción breve del producto..."></textarea>
    </div>
    <div class="field">
      <label>URL de imagen</label>
      <input type="url" id="f-img" placeholder="https://..." oninput="previewImg(this.value)">
      <p class="hint">Pegá el link directo a una foto.</p>
      <img id="img-preview" class="modal-img-preview" src="" alt="" style="display:none">
    </div>
    <div class="field">
      <label>Orden de aparición (número)</label>
      <input type="number" id="f-order" placeholder="1" min="0">
    </div>
    <div class="field">
      <label>Visible en el sitio</label>
      <div class="toggle-wrap">
        <button class="toggle on" id="toggle-active" onclick="toggleActive()" type="button"></button>
        <span id="toggle-label" style="font-size:14px;color:var(--muted)">Sí, visible</span>
      </div>
    </div>

    <div id="modal-msg"></div>
    <div class="modal-actions">
      <button class="btn-save" onclick="save()">Guardar</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  const SB_URL = 'https://tcckwzcjxrvclcyngwgm.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjY2t3emNqeHJ2Y2xjeW5nd2dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTM0NzcsImV4cCI6MjEwMjI4OTQ3N30.o-oRxxJY6j49B8GNkvA6RlU3SpM2OrkQ8Kqz4gTE-uE';
  const ADMIN_PASS = 'eGrill2024';

  let activeState = true;

  function login() {
    const pwd = document.getElementById('pwd').value;
    if (pwd === ADMIN_PASS) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('admin').style.display = 'block';
      loadProducts();
    } else {
      document.getElementById('login-err').textContent = 'Contraseña incorrecta.';
    }
  }

  function fmt(n) { return '$ ' + Number(n).toLocaleString('es-AR'); }

  async function loadProducts() {
    const r = await fetch(`${SB_URL}/rest/v1/egrill_products?order=sort_order.asc`, {
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
    });
    const products = await r.json();
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = products.map(p => `
      <tr>
        <td>${p.image_url ? `<img src="${p.image_url}" class="td-img" alt="">` : `<div class="td-img" style="display:flex;align-items:center;justify-content:center;font-size:24px">🔥</div>`}</td>
        <td class="td-name">${p.name}</td>
        <td><span class="td-cat ${p.category==='repuesto'?'rep':''}">${p.category==='parrilla'?'Parrilla':'Repuesto'}</span></td>
        <td class="td-price">${fmt(p.price)}</td>
        <td><span class="td-active ${p.active?'':'off'}"></span></td>
        <td>
          <button class="btn-edit" onclick='editProduct(${JSON.stringify(p)})'>Editar</button>
          <button class="btn-del" onclick="delProduct('${p.id}','${p.name}')">Eliminar</button>
        </td>
      </tr>`).join('');
  }

  function openModal(p) {
    document.getElementById('modal-title').textContent = p ? 'Editar producto' : 'Nuevo producto';
    document.getElementById('f-id').value = p?.id || '';
    document.getElementById('f-name').value = p?.name || '';
    document.getElementById('f-cat').value = p?.category || 'parrilla';
    document.getElementById('f-price').value = p?.price || '';
    document.getElementById('f-desc').value = p?.description || '';
    document.getElementById('f-img').value = p?.image_url || '';
    document.getElementById('f-order').value = p?.sort_order ?? 0;
    document.getElementById('modal-msg').innerHTML = '';
    activeState = p ? p.active : true;
    updateToggle();
    previewImg(p?.image_url || '');
    document.getElementById('modal-bg').classList.add('open');
  }

  function editProduct(p) { openModal(p); }
  function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

  function toggleActive() {
    activeState = !activeState;
    updateToggle();
  }

  function updateToggle() {
    const btn = document.getElementById('toggle-active');
    const lbl = document.getElementById('toggle-label');
    btn.className = 'toggle' + (activeState ? ' on' : '');
    lbl.textContent = activeState ? 'Sí, visible' : 'No, oculto';
  }

  function previewImg(url) {
    const img = document.getElementById('img-preview');
    if (url) { img.src = url; img.style.display = 'block'; }
    else { img.style.display = 'none'; }
  }

  function showMsg(text, type) {
    document.getElementById('modal-msg').innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  async function save() {
    const id = document.getElementById('f-id').value;
    const body = {
      name: document.getElementById('f-name').value.trim(),
      category: document.getElementById('f-cat').value,
      price: parseInt(document.getElementById('f-price').value) || 0,
      description: document.getElementById('f-desc').value.trim(),
      image_url: document.getElementById('f-img').value.trim() || null,
      sort_order: parseInt(document.getElementById('f-order').value) || 0,
      active: activeState,
      updated_at: new Date().toISOString()
    };
    if (!body.name || !body.price) { showMsg('El nombre y el precio son obligatorios.', 'err'); return; }

    const url = id
      ? `${SB_URL}/rest/v1/egrill_products?id=eq.${id}`
      : `${SB_URL}/rest/v1/egrill_products`;
    const method = id ? 'PATCH' : 'POST';

    const r = await fetch(url, {
      method, headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(body)
    });

    if (r.ok) {
      showMsg('✓ Guardado correctamente.', 'ok');
      setTimeout(() => { closeModal(); loadProducts(); }, 800);
    } else {
      showMsg('Error al guardar. Intentá de nuevo.', 'err');
    }
  }

  async function delProduct(id, name) {
    if (!confirm(`¿Eliminar "${name}"? Esta acción no se puede deshacer.`)) return;
    await fetch(`${SB_URL}/rest/v1/egrill_products?id=eq.${id}`, {
      method: 'DELETE',
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` }
    });
    loadProducts();
  }
</script>
</body>
</html>
